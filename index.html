<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육평가 성적조회</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f3f6fa;margin:0;color:#17253a}.wrap{max-width:540px;margin:9vh auto;padding:20px}.card{background:white;border-radius:18px;padding:32px;box-shadow:0 12px 36px #182a4512}h1{font-size:25px;margin:0 0 10px}p{color:#617086;line-height:1.6}label{display:block;margin:24px 0 8px;font-weight:700}input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:10px;font-size:18px}button{background:#165bc5;color:white;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;margin-top:14px;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:18px;color:#a33535}.result{margin-top:22px;border-top:1px solid #e3e8ef;padding-top:16px}.result div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f5}.result strong{color:#17253a}small{color:#64748b}.footer{margin-top:22px;text-align:center;font-size:13px}</style></head><body><main class="wrap"><section class="card"><h1>교육평가 성적조회</h1><p>본인의 사번 8자리를 입력하면 공개된 성적을 확인할 수 있습니다.</p><form id="form"><label for="employee">사번</label><input id="employee" maxlength="8" inputmode="numeric" pattern="[0-9]{8}" autocomplete="off" placeholder="사번 8자리" required><button id="submit">성적 조회하기</button></form><div class="msg" id="message" role="status" aria-live="polite"></div><div class="result" id="result" hidden></div><p class="footer">공용 기기에서는 조회 후 화면을 닫아주세요.</p></section></main><script>
const endpoint='https://njclnpclernrvflbpxsp.supabase.co/functions/v1/score-api';
const publishableKey='sb_publishable_XrjNj7nRzBaSCqp6TM3KdQ_B--Ak1P9';
const form=document.getElementById('form'),message=document.getElementById('message'),result=document.getElementById('result'),button=document.getElementById('submit');
const labels=[['s1','1회차 본시험'],['r1','1회차 재시험'],['s2','2회차 본시험'],['r2','2회차 재시험']];
function row(k,v){const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('strong');a.textContent=k;b.textContent=v;d.append(a,b);return d}
form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=true;result.replaceChildren();message.textContent='';const id=document.getElementById('employee').value.trim();if(!/^\d{8}$/.test(id)){message.textContent='사번 8자리를 정확히 입력해주세요.';return}button.disabled=true;button.textContent='조회 중...';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':publishableKey},body:JSON.stringify({action:'lookup',employee_id:id})});const data=await r.json();if(!r.ok){message.textContent=data.error||'조회에 실패했습니다.';return}const s=data.student;if(!s){message.textContent='조회된 성적이 없습니다.';return}result.append(row('성명',s.name||'-'));for(const [key,label] of labels)result.append(row(label,s[key]===null||s[key]===undefined?'미입력':`${s[key]}점`));result.hidden=false}catch{message.textContent='서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.'}finally{button.disabled=false;button.textContent='성적 조회하기'}});
</script></body></html>
